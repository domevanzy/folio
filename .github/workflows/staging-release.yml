name: Staging release

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci

      - name: Validate staging configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          STAGING_DB_MIGRATION_URL: ${{ secrets.STAGING_DB_MIGRATION_URL }}
          STAGING_SCHEMA_DATABASE_CA: ${{ vars.STAGING_SCHEMA_DATABASE_CA }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          for key in VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_TEAM_ID STAGING_DB_MIGRATION_URL STAGING_SCHEMA_DATABASE_CA STAGING_SUPABASE_PROJECT_REF; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub configuration: $key"
              exit 1
            fi
          done
          node --input-type=module <<'JS'
          const { STAGING_DB_MIGRATION_URL, STAGING_SUPABASE_PROJECT_REF } = process.env;
          const url = URL.parse(STAGING_DB_MIGRATION_URL);
          if (!url || !["postgres:", "postgresql:"].includes(url.protocol) ||
              !url.hostname.endsWith(".pooler.supabase.com") ||
              (url.port && url.port !== "5432") ||
              url.username !== `postgres.${STAGING_SUPABASE_PROJECT_REF}`) {
            console.error("STAGING_DB_MIGRATION_URL must use the staging project’s Session pooler and postgres role.");
            process.exit(1);
          }
          JS

      - name: Deploy exact commit to Vercel and wait for Ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_REPO_ID: ${{ github.repository_id }}
        run: |
          payload=$(jq -n --arg project "$VERCEL_PROJECT_ID" --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" --argjson repo "$GITHUB_REPO_ID" \
            '{name: "folio", project: $project, gitSource: {type: "github", repoId: $repo, ref: $ref, sha: $sha}}')
          deployment=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            -d "$payload" "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID")
          deployment_id=$(jq -er '.id' <<< "$deployment")
          echo "Vercel deployment: $deployment_id"
          for ((attempt = 0; attempt < 100; attempt++)); do
            status=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID")
            case "$(jq -er '.readyState' <<< "$status")" in
              READY)
                jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
                  '(.gitSource.sha // .meta.githubCommitSha) == $sha and
                   (.gitSource.ref // .meta.githubCommitRef) == $ref and .target != "production"' \
                  <<< "$status" >/dev/null
                echo "Vercel Ready for $GITHUB_SHA"
                exit 0
                ;;
              ERROR|CANCELED)
                echo "::error::Vercel deployment $deployment_id did not reach Ready."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Vercel deployment $deployment_id."
          exit 1

      - name: Apply pending migrations
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_DB_MIGRATION_URL: ${{ secrets.STAGING_DB_MIGRATION_URL }}
          STAGING_SCHEMA_DATABASE_CA: ${{ vars.STAGING_SCHEMA_DATABASE_CA }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq '.object.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::error::Staging moved during the build. Run the release for the current commit."
            exit 1
          fi
          cert="$RUNNER_TEMP/staging-supabase-ca.pem"
          printf '%s\n' "$STAGING_SCHEMA_DATABASE_CA" > "$cert"
          db_url=$(node --input-type=module - "$cert" <<'JS'
          const url = new URL(process.env.STAGING_DB_MIGRATION_URL);
          url.searchParams.set("sslmode", "verify-full");
          url.searchParams.set("sslrootcert", process.argv[2]);
          console.log(url.href);
          JS
          )
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url" --yes

      - name: Deploy Edge Functions when their inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [[ ! -d supabase/functions ]]; then exit 0; fi
          last_release=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/staging-release.yml/runs?branch=staging&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [[ -n "$last_release" ]] && git diff --quiet "$last_release" "$GITHUB_SHA" -- supabase/functions supabase/config.toml; then
            exit 0
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Set STAGING_SUPABASE_ACCESS_TOKEN to deploy Edge Functions."
            exit 1
          fi
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

      - name: Check migrated schema and RPC permissions
        env:
          STAGING_DB_MIGRATION_URL: ${{ secrets.STAGING_DB_MIGRATION_URL }}
          STAGING_SCHEMA_DATABASE_CA: ${{ vars.STAGING_SCHEMA_DATABASE_CA }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/check-staging-schema.mjs
