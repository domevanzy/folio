name: Folio release

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: folio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci

      - name: Validate release configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          RELEASE_DB_MIGRATION_URL: ${{ secrets[format('{0}_DB_MIGRATION_URL', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          RELEASE_SCHEMA_DATABASE_CA: ${{ secrets[format('{0}_SCHEMA_DATABASE_CA', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          RELEASE_SUPABASE_PROJECT_REF: ${{ secrets[format('{0}_SUPABASE_PROJECT_REF', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [[ "$GITHUB_REF_NAME" == main && "$RELEASE_SUPABASE_PROJECT_REF" == "$STAGING_PROJECT_REF" ]]; then
            echo "::error::Production and staging must target separate Supabase projects."
            exit 1
          fi
          for key in VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_TEAM_ID RELEASE_DB_MIGRATION_URL RELEASE_SCHEMA_DATABASE_CA RELEASE_SUPABASE_PROJECT_REF; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub configuration: $key"
              exit 1
            fi
          done
          node --input-type=module <<'JS'
          const { RELEASE_DB_MIGRATION_URL, RELEASE_SUPABASE_PROJECT_REF } = process.env;
          const url = URL.parse(RELEASE_DB_MIGRATION_URL);
          if (!url || !["postgres:", "postgresql:"].includes(url.protocol) ||
              !url.hostname.endsWith(".pooler.supabase.com") ||
              (url.port && url.port !== "5432") ||
              url.username !== `postgres.${RELEASE_SUPABASE_PROJECT_REF}`) {
            console.error("RELEASE_DB_MIGRATION_URL must use the target project’s Session pooler and postgres role.");
            process.exit(1);
          }
          JS

      - name: Deploy exact commit to Vercel Preview and wait for Ready
        if: github.ref_name == 'staging'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          GITHUB_REPO_ID: ${{ github.repository_id }}
        run: |
          payload=$(jq -n --arg project "$VERCEL_PROJECT_ID" --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" --argjson repo "$GITHUB_REPO_ID" \
            '{name: "folio", project: $project, gitSource: {type: "github", repoId: $repo, ref: $ref, sha: $sha}}')
          deployment=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            -d "$payload" "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID")
          deployment_id=$(jq -er '.id' <<< "$deployment")
          echo "Vercel deployment: $deployment_id"
          for ((attempt = 0; attempt < 100; attempt++)); do
            status=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID")
            case "$(jq -er '.readyState' <<< "$status")" in
              READY)
                jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
                  '(.gitSource.sha // .meta.githubCommitSha) == $sha and
                   (.gitSource.ref // .meta.githubCommitRef) == $ref and .target != "production"' \
                  <<< "$status" >/dev/null
                echo "Vercel Ready for $GITHUB_SHA"
                exit 0
                ;;
              ERROR|CANCELED)
                echo "::error::Vercel deployment $deployment_id did not reach Ready."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Vercel deployment $deployment_id."
          exit 1

      - name: Build staged Vercel Production deployment
        if: github.ref_name == 'main'
        id: production-build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          url=$(npx --yes vercel@65.4.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          if [[ ! "$url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return a deployment URL."
            exit 1
          fi
          deployment=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID")
          if ! jq -e --arg project "$VERCEL_PROJECT_ID" \
            '.readyState == "READY" and .target == "production" and .projectId == $project' \
            <<< "$deployment" >/dev/null; then
            jq -r '"::error::Unexpected deployment state: \(.readyState), target: \(.target)"' <<< "$deployment"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Apply pending migrations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DB_MIGRATION_URL: ${{ secrets[format('{0}_DB_MIGRATION_URL', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          RELEASE_SCHEMA_DATABASE_CA: ${{ secrets[format('{0}_SCHEMA_DATABASE_CA', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::error::The release branch moved during the build. Run the release for the current commit."
            exit 1
          fi
          cert="$RUNNER_TEMP/release-supabase-ca.pem"
          printf '%s\n' "$RELEASE_SCHEMA_DATABASE_CA" > "$cert"
          db_url=$(node --input-type=module - "$cert" <<'JS'
          const url = new URL(process.env.RELEASE_DB_MIGRATION_URL);
          url.searchParams.set("sslmode", "verify-full");
          url.searchParams.set("sslrootcert", process.argv[2]);
          console.log(url.href);
          JS
          )
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url" --yes

      - name: Deploy Edge Functions when their inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets[format('{0}_SUPABASE_ACCESS_TOKEN', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          PROJECT_REF: ${{ secrets[format('{0}_SUPABASE_PROJECT_REF', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
        run: |
          if [[ ! -d supabase/functions ]]; then exit 0; fi
          last_release=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/staging-release.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [[ -n "$last_release" ]] && git diff --quiet "$last_release" "$GITHUB_SHA" -- supabase/functions supabase/config.toml; then
            exit 0
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Set RELEASE_SUPABASE_ACCESS_TOKEN to deploy Edge Functions."
            exit 1
          fi
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

      - name: Check migrated schema and RPC permissions
        env:
          RELEASE_DB_MIGRATION_URL: ${{ secrets[format('{0}_DB_MIGRATION_URL', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          RELEASE_SCHEMA_DATABASE_CA: ${{ secrets[format('{0}_SCHEMA_DATABASE_CA', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
          RELEASE_SUPABASE_PROJECT_REF: ${{ secrets[format('{0}_SUPABASE_PROJECT_REF', github.ref_name == 'main' && 'PRODUCTION' || 'STAGING')] }}
        run: node scripts/check-release-schema.mjs

      - name: Promote verified Production deployment
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          DEPLOYMENT_URL: ${{ steps.production-build.outputs.url }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::error::Production moved during the release. The staged deployment was not promoted."
            exit 1
          fi
          npx --yes vercel@65.4.0 promote "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --timeout 5m
